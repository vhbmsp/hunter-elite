<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunter Elite</title>
</head>
<body>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="scope">
      <div class="reticle-h"></div>
      <div class="reticle-v"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateY(-30px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateY(-60px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateY(30px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateY(60px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateX(-30px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateX(-60px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateX(30px);"></div>
      <div class="dot" style="transform: translate(-50%, -50%) translateX(60px);"></div>
    </div>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="ammo">Rounds: 5 · Spare mags: 2</div>
      <div id="distance">Distance: —</div>
      <div id="zoom">Zoom: 1x</div>
    </div>
    <div id="instructions">Click to aim · Hold RMB for scope · LMB or Space to shoot · R to reload</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
